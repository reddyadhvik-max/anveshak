# Post-processing for anveshak.infer. Starting values; P3 tunes unknown_* (and known_iou) on val OE.
known_conf: 0.001     # low: mAP is ranked, extra low-score boxes only help
known_iou: 0.6        # per-class NMS
max_candidates: 30000 # pre-NMS cap per tile
max_known: 900
unknown_conf: 0.10      # re-tuned 26 Nov on the A3 base (B-val proxy, TTA): plateau 0.10/48/10/0.5 = U-F1 0.160 vs 0.146 at 0.05
unknown_iou: 0.5
unknown_min_side: 48  # px, sqrt-area. Proxy peak was 64 (0.189), but 80 collapses; 48 keeps margin (tiny unknowns are mostly missed cars)
unknown_known_max: 1.0  # off again: on the 430-GT all-B proxy, 1.0 beats 0.5 on every base from A3 up (27 Nov)
max_unknown: 10       # top-k unknowns per tile; max_known + max_unknown <= 1000 rows per tile (competition cap)
unknown_gamma: 1.0     # unknown = max(s_unk, s_obj * (1 - max known)^gamma); < 1 softens the known penalty (grid 27 Nov)
